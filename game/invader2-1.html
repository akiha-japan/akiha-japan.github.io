<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚀 SPACE HONGDARS Version 2.17 🐥</title>

  <meta property="og:url" content="https://akiha-japan.github.io/game/invader2_17.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="🚀 SPACE HONGDARS Version 2.17 🐥">
  <meta property="og:description" content="ひよこの地球防衛隊員🐥が、巨大アリ ホングダーから地球を守る！スマホで遊べる本格インベーダー風シューティングゲーム。">
  <meta property="og:image" content="https://akiha-japan.github.io/logo_v2_1.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-user-select: none;
      user-select: none;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-bottom: 50px;
    }

    .game-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 15px 0 10px 0;
      text-align: center;
      letter-spacing: 2px;
      background: linear-gradient(to right, #00ffff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 65vh;
      min-height: 440px;
      max-height: 600px;
      background: #000;
      border: 2px solid #333;
      touch-action: pan-y; 
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      touch-action: none; 
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 0.95rem;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 2px 2px 3px #000;
      z-index: 10;
    }
    #stage-board { color: #00ffff; }
    #score-board { color: #ffffff; }
    #life-board { color: #ff3366; }

    .state-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 85%;
      background: rgba(0, 0, 0, 0.95);
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #00ffff;
      z-index: 20;
      box-sizing: border-box;
    }
    .state-overlay h2 { margin: 0 0 10px 0; font-size: 1.8rem; line-height: 1.4; }
    .state-overlay p { margin: 5px 0 15px 0; font-size: 1.0rem; color: #ffcc00; line-height: 1.5; }
    .btn-retry {
      background: linear-gradient(135deg, #00ffff, #00cccc);
      border: none;
      color: #000;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 5px;
    }

    .info-area {
      width: 90%;
      max-width: 460px;
      margin-top: 20px;
      box-sizing: border-box;
    }
    .instruction-box {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #ccc;
      background: rgba(34, 34, 34, 0.8);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      margin-bottom: 10px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="page-wrapper">
    
    <div class="game-title">🚀 SPACE HONGDARS V2.17 🐥</div>
    
    <div class="game-container">
      <div class="hud">
        <div id="stage-board">STAGE: <span id="stage">1</span></div>
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <div id="life-board">LIFE: <span id="life">❤️❤️❤️</span></div>
      </div>

      <canvas id="gameCanvas"></canvas>

      <div id="status-panel" class="state-overlay hidden">
        <h2 id="status-title">GAME OVER</h2>
        <p id="status-msg"></p>
        <div id="status-score" style="margin: 10px 0; font-size: 1.4rem; font-weight: bold;"></div>
        <button class="btn-retry" id="btn-retry">RETRY</button>
      </div>
    </div>

    <div class="info-area">
      <div class="instruction-box">
        自機（🐥）を左右にスライドして動かします。タッチしている間、弾は自動で連射されます。<br>
        王冠（👑）を取ると、弾が3方向のワイドショットにパワーアップします！
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const stageEl = document.getElementById("stage");
    const lifeEl = document.getElementById("life");
    const stageBoardEl = document.getElementById("stage-board");
    
    const statusPanel = document.getElementById("status-panel");
    const statusTitle = document.getElementById("status-title");
    const statusMsg = document.getElementById("status-msg");
    const statusScore = document.getElementById("status-score");
    const btnRetry = document.getElementById("btn-retry");

    let audioCtx = null;

    let score = 0;
    let stage = 1;
    let lives = 3; 
    let gameOver = false;
    let gameClear = false;
    
    let invulnerableTimer = 0; 
    let autoFireTimer = 0; 

    const player = { x: 220, y: 500, width: 36, height: 36, speed: 7.5, mode: 'single' };
    let deadLineY = 450; 

    let bullets = [];
    let invaders = [];
    let particles = [];
    let stars = [];
    let enemyBullets = [];
    let ufo = null;
    let powerup = null;
    let boss = null; 

    let invaderDirection = 1;
    let baseSpeed = 0.65; // 1倍速ループ用に速度を適正化
    let isPointerDown = false;
    let totalInvadersInLevel = 0; 

    function syncLayout() {
      const container = document.querySelector('.game-container');
      const w = container.clientWidth || 480;
      const h = container.clientHeight || 500;
      
      canvas.width = w;
      canvas.height = h;

      player.y = h - 60;
      deadLineY = h - 80;

      if (player.x < 0) player.x = 0;
      if (player.x > w - player.width) player.x = w - player.width;
      if (player.x === 220) {
        player.x = w / 2 - player.width / 2;
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(freq, type, dur) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function updateStageDisplay() {
      if (stage === 3) {
        stageBoardEl.innerHTML = "<span style='color:#ff00ff; font-weight:bold; font-family:serif;'>FINAL BOSS</span>";
      } else {
        stageBoardEl.innerHTML = "STAGE: <span>" + stage + "</span>";
      }
    }

    function initLevel() {
      invaders = [];
      bullets = [];
      enemyBullets = [];
      ufo = null;
      powerup = null;
      boss = null;
      invaderDirection = 1;
      invulnerableTimer = 0; 

      updateStageDisplay();

      if (stage === 3) {
        boss = {
          x: canvas.width / 2 - 40,
          y: 95, 
          width: 80,
          height: 40,
          hp: 40, 
          maxHp: 40,
          vx: 2.5, 
          hitFlash: 0,
          shootTimer: 0
        };
        return;
      }

      let cols = Math.floor(canvas.width / 60);
      if (cols < 4) cols = 4;
      if (cols > 7) cols = 7;
      
      let spacing = 52;
      let startX = (canvas.width - ((cols - 1) * spacing + 30)) / 2;

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < cols; c++) {
          let type = "bike";
          let hp = 1; 
          
          if (r === 0) { type = "tako"; hp = 2; } 
          if (r === 1) { type = "monster"; } 
          if (r === 2) { type = "phone"; }        
          if (r === 3) { type = "ari"; }   

          invaders.push({
            x: startX + c * spacing,
            y: 45 + r * 34, 
            width: 30,
            height: 25,
            type: type,
            hp: hp,           
            maxHp: hp,        
            hitFlash: 0,      
            alive: true
          });
        }
      }
      totalInvadersInLevel = invaders.length; 
    }

    // 星くずの初期配置（スピード感を調整）
    stars = [];
    for(let i=0; i<60; i++) {
      stars.push({ x: Math.random() * 480, y: Math.random() * 600, speed: Math.random() * 2.5 + 0.6 });
    }

    function handlePointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      const touchX = clientX - rect.left;
      let targetX = touchX - player.width / 2;
      
      if (targetX < 0) targetX = 0;
      if (targetX > canvas.width - player.width) targetX = canvas.width - player.width;
      
      player.x = targetX;
    }

    canvas.addEventListener("touchstart", (e) => {
      if (gameOver || gameClear) return;
      initAudio();
      isPointerDown = true;
      if(e.touches && e.touches[0]) {
        handlePointer(e.touches[0].clientX);
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (isPointerDown && !gameOver && !gameClear) {
        if(e.touches && e.touches[0]) {
          handlePointer(e.touches[0].clientX);
        }
      }
    }, { passive: true });

    canvas.addEventListener("touchend", () => isPointerDown = false);
    canvas.addEventListener("touchcancel", () => isPointerDown = false);

    canvas.addEventListener("mousedown", (e) => {
      if (gameOver || gameClear) return;
      initAudio();
      isPointerDown = true;
      handlePointer(e.clientX);
    });
    window.addEventListener("mousemove", (e) => {
      if (isPointerDown && !gameOver && !gameClear) {
        handlePointer(e.clientX);
      }
    });
    window.addEventListener("mouseup", () => isPointerDown = false);

    let rightPressed = false;
    let leftPressed = false;
    document.addEventListener("keydown", (e) => {
      initAudio();
      if (e.key === "ArrowRight") { rightPressed = true; isPointerDown = true; }
      if (e.key === "ArrowLeft") { leftPressed = true; isPointerDown = true; }
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight") { rightPressed = false; if(!leftPressed) isPointerDown = false; }
      if (e.key === "ArrowLeft") { leftPressed = false; if(!rightPressed) isPointerDown = false; }
    });

    function checkAutoFire() {
      if (!isPointerDown || gameOver || gameClear) return;
      autoFireTimer++;
      // 🛠️ 1倍速ループ化に伴い、連射が遅く感じられないよう間隔を6フレームに短縮
      if (autoFireTimer >= 6) { 
        autoFireTimer = 0;
        fireBullet();
      }
    }

    function fireBullet() {
      if (player.mode === 'wide') {
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 11, speed: 9.5, vx: -1.6, color: "#ff00ff" });
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 11, speed: 9.5, vx: 0, color: "#ff00ff" });
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 11, speed: 9.5, vx: 1.6, color: "#ff00ff" });
      } else {
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 11, speed: 9.5, vx: 0, color: "#ffff00" });
      }
      playSound(360, 'square', 0.04);
    }

    function triggerGameOver(message = "") {
      gameOver = true;
      isPointerDown = false;
      playSound(80, 'sawtooth', 0.7);
      statusTitle.textContent = "GAME OVER";
      statusTitle.style.color = "#ff3333";
      statusMsg.textContent = message;
      statusScore.textContent = "SCORE: " + score;
      statusPanel.classList.remove("hidden");
    }

    function playerHit() {
      if (invulnerableTimer > 0) return; 
      lives--;
      player.mode = 'single'; 
      lifeEl.textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);

      if (lives <= 0) {
        triggerGameOver("ひよこのライフが尽きてしまった...");
      } else {
        invulnerableTimer = 90; 
        playSound(160, 'sine', 0.25);
        for(let k=0; k<15; k++) {
          particles.push({ x: player.x + 18, y: player.y + 18, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7, life: 25, color: "#ff3366" });
        }
      }
    }

    function resetGame() {
      score = 0;
      stage = 1;
      lives = 3;
      gameOver = false;
      gameClear = false;
      bullets = [];
      enemyBullets = [];
      particles = [];
      player.mode = 'single';
      isPointerDown = false;
      invulnerableTimer = 0; 
      scoreEl.textContent = score;
      lifeEl.textContent = "❤️❤️❤️";
      statusPanel.classList.add("hidden");
      syncLayout();
      initLevel();
    }

    btnRetry.addEventListener("click", (e) => {
      e.stopPropagation();
      resetGame();
    });

    function gameLoop() {
      // 🛠️ 過去の残像データをバッファから物理的に完全消去（半透明化・ブレの絶対防御）
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 改めて黒背景で塗りつぶし
      ctx.fillStyle = "#000000"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      stars.forEach(st => {
        st.y += st.speed;
        if(st.y > canvas.height) { st.y = 0; st.x = Math.random() * canvas.width; }
      });

      if (gameOver || gameClear) return;

      if (invulnerableTimer > 0) invulnerableTimer--;

      if(!ufo && Math.random() < 0.0035) {
        ufo = { x: -40, y: 38, width: 30, height: 20, speed: canvas.width * 0.007 };
      }
      if(ufo) {
        ufo.x += ufo.speed;
        if(ufo.x > canvas.width) ufo = null;
      }

      if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
      if (leftPressed && player.x > 0) player.x -= player.speed;
      if (player.x < 0) player.x = 0;
      if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

      checkAutoFire();

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i]; b.y -= b.speed; b.x += b.vx;
        if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
      }

      if (stage === 3 && boss) {
        if (boss.hitFlash > 0) boss.hitFlash--;
        boss.x += boss.vx;
        if (boss.x <= 0 || boss.x >= canvas.width - boss.width) {
          boss.vx *= -1;
        }

        boss.shootTimer++;
        if (boss.shootTimer > 40) { 
          boss.shootTimer = 0;
          let bx = boss.x + boss.width / 2;
          let by = boss.y + boss.height;
          
          enemyBullets.push({ x: bx, y: by, speed: 3.8, vx: -1.5, r: 6 });
          enemyBullets.push({ x: bx, y: by, speed: 4.2, vx: 0, r: 6 });
          enemyBullets.push({ x: bx, y: by, speed: 3.8, vx: 1.5, r: 6 });
          playSound(200, 'triangle', 0.1);
        }
      } 
      else {
        let aliveCount = 0;
        invaders.forEach(inv => { 
          if (inv.alive) aliveCount++; 
          if (inv.hitFlash > 0) inv.hitFlash--; 
        });

        let speedMultiplier = 1.0;
        if (totalInvadersInLevel > 0 && aliveCount > 0) {
          let deathRatio = (totalInvadersInLevel - aliveCount) / totalInvadersInLevel;
          speedMultiplier = 1.0 + deathRatio * 2.2; 
        }

        let shiftDown = false;
        let currentSpeed = (baseSpeed + (stage - 1) * 0.15) * invaderDirection * speedMultiplier;

        for (let i = 0; i < invaders.length; i++) {
          let inv = invaders[i];
          if (!inv.alive) continue;
          inv.x += currentSpeed;
          if (inv.x > canvas.width - inv.width || inv.x < 0) shiftDown = true;
          
          if (inv.y + inv.height >= deadLineY) {
            triggerGameOver("地球が侵略されてしまった！");
            return;
          }
        }

        if (shiftDown) {
          invaderDirection *= -1;
          invaders.forEach(inv => { if (inv.alive) inv.y += 12; }); 
        }

        let shootProbability = 0.0007; 
        if (stage === 2) {
          shootProbability = 0.001; 
        }

        invaders.forEach(inv => {
          if (inv.alive && Math.random() < shootProbability * stage) {
            enemyBullets.push({ x: inv.x + inv.width/2, y: inv.y + inv.height, speed: 3.2 + stage*0.2, vx: 0, r: 4.5 });
          }
        });
      }

      if (ufo && Math.random() < 0.015) { 
        let ufoCenterX = ufo.x + ufo.width / 2;
        let ufoCenterY = ufo.y + ufo.height;
        let dx = (player.x + player.width / 2) - ufoCenterX;
        let dy = player.y - ufoCenterY;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let bulletSpeed = 4.2;
        enemyBullets.push({ x: ufoCenterX, y: ufoCenterY, speed: (dy / distance) * bulletSpeed, vx: (dx / distance) * bulletSpeed, r: 4.5 });
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i]; 
        eb.y += eb.speed;
        if (eb.vx) eb.x += eb.vx;

        if (eb.y > canvas.height || eb.x < 0 || eb.x > canvas.width) { 
          enemyBullets.splice(i, 1); 
          continue; 
        }
        if (eb.x + eb.r > player.x + 3 && eb.x - eb.r < player.x + player.width - 3 && 
            eb.y + eb.r > player.y + 3 && eb.y - eb.r < player.y + player.height - 3) {
          enemyBullets.splice(i, 1); playerHit();
        }
      }

      if(powerup) {
        powerup.y += 2.0;
        if(powerup.y > canvas.height) {
          powerup = null;
        } else if(powerup.x > player.x && powerup.x < player.x + player.width && 
                  powerup.y > player.y && powerup.y < player.y + player.height) {
          player.mode = 'wide'; 
          powerup = null; 
          playSound(750, 'sine', 0.22); 
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; if(p.life <= 0) particles.splice(i, 1);
      }

      for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
        let b = bullets[bIdx]; 
        let bulletRemoved = false;
        
        if (stage === 3 && boss) {
          if (b.x > boss.x && b.x < boss.x + boss.width && b.y > boss.y && b.y < boss.y + boss.height) {
            bullets.splice(bIdx, 1);
            bulletRemoved = true;
            boss.hp--;
            boss.hitFlash = 4;
            score += 15;
            scoreEl.textContent = score;
            playSound(240, 'triangle', 0.04);

            for(let k=0; k<4; k++) {
              particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 12, color: "#ffff00" });
            }

            if (boss.hp <= 0) {
              gameClear = true;
              score += 2000; 
              scoreEl.textContent = score;
              playSound(650, 'sine', 1.0);
              statusTitle.textContent = "CONGRATULATIONS!";
              statusTitle.style.color = "#00ffff";
              statusMsg.textContent = "ひよこ🐥はホングダーから地球を守り抜いた！";
              statusScore.textContent = "FINAL SCORE: " + score;
              statusPanel.classList.remove("hidden");
            }
          }
        } 
        else {
          for (let i = 0; i < invaders.length; i++) {
            let inv = invaders[i];
            if (inv.alive && b.x > inv.x && b.x < inv.x + inv.width && b.y > inv.y && b.y < inv.y + inv.height) {
              bullets.splice(bIdx, 1); 
              bulletRemoved = true;
              
              inv.hp--;
              if (inv.hp > 0) {
                inv.hitFlash = 5; 
                if (inv.type === "tako") inv.type = "ika"; 
                playSound(220, 'triangle', 0.04);
                for(let k=0; k<4; k++) {
                  particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 10, color: "#ff00ff" });
                }
              } else {
                inv.alive = false;
                
                if (inv.type === "tako" || inv.type === "ika") score += 50; 
                else if (inv.type === "monster") score += 35;
                else if (inv.type === "phone") score += 25;
                else if (inv.type === "ari") score += 20;
                else score += 10;

                scoreEl.textContent = score; 
                playSound(150, 'sawtooth', 0.04);
                
                for(let k=0; k<6; k++) {
                  particles.push({ x: inv.x + inv.width/2, y: inv.y + inv.height/2, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 15, color: "#ff9900" });
                }
                if(Math.random() < 0.18 && !powerup) powerup = { x: inv.x + inv.width/2, y: inv.y };
              }
              break;
            }
          }
        }

        if (bulletRemoved) continue;

        if (ufo && b.x > ufo.x && b.x < ufo.x + ufo.width && b.y > ufo.y && b.y < ufo.y + ufo.height) {
          ufo = null; bullets.splice(bIdx, 1); score += 150; scoreEl.textContent = score; playSound(500, 'sine', 0.18);
          for(let k=0; k<10; k++) particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 20, color: "#00ffff" });
        }
      }

      if (stage < 3) {
        let aliveCount = 0;
        invaders.forEach(inv => { if (inv.alive) aliveCount++; });
        if (aliveCount === 0 && invaders.length > 0) {
          stage++; 
          player.mode = 'single'; 
          let currentLives = 0;
          for(let i=0; i<lifeEl.textContent.length; i++) {
            if(lifeEl.textContent[i] === "❤️") currentLives++;
          }
          if (currentLives < 3) {
            currentLives++;
            lifeEl.textContent = "❤️".repeat(currentLives) + "🖤".repeat(3 - currentLives);
          }
          initLevel(); 
        }
      }
    }

    function draw() {
      // 1. 星くずの描画
      stars.forEach(st => {
        ctx.fillStyle = `rgba(255, 255, 255, ${st.speed / 2.5})`; 
        ctx.fillRect(st.x, st.y, st.speed * 0.8, st.speed * 0.8);
      });

      // 2. 防衛ラインの描画
      if (stage < 3) {
        ctx.strokeStyle = "rgba(0, 255, 255, 0.4)"; 
        ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); ctx.beginPath();
        ctx.moveTo(0, deadLineY); ctx.lineTo(canvas.width, deadLineY); ctx.stroke(); ctx.setLineDash([]); 
      }

      // 🛠️ アルファチャンネル（透明度）を1.0に絶対固定
      ctx.globalAlpha = 1.0;

      // 3. 自機（ひよこ）の描画
      if (invulnerableTimer === 0 || Math.floor(invulnerableTimer / 8) % 2 === 0) {
        ctx.font = "34px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("🐥", player.x + player.width/2, player.y + player.height/2 + 2);
      }

      // 4. 各種オブジェクト描画
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      enemyBullets.forEach(eb => {
        ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ff0033"; ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke(); 
      });

      particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); });

      ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if(powerup) ctx.fillText("👑", powerup.x, powerup.y);
      if(ufo) ctx.fillText("🛸", ufo.x + ufo.width/2, ufo.y);

      if (stage === 3 && boss) {
        if (!(boss.hitFlash > 0 && Math.floor(boss.hitFlash / 2) % 2 === 0)) {
          ctx.font = "60px sans-serif"; 
          ctx.fillText("🐜", boss.x + boss.width / 2, boss.y + boss.height / 2);
        }

        let gaugeW = 160;
        let gaugeH = 10;
        let gx = (canvas.width - gaugeW) / 2 + 35; 
        let gy = 40; 
        
        ctx.font = "bold 11px 'Courier New', sans-serif";
        ctx.fillStyle = "#ff00ff";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText("BOSS HP ", gx - 5, gy + gaugeH / 2);

        ctx.fillStyle = "#222";
        ctx.fillRect(gx, gy, gaugeW, gaugeH);
        
        let currentW = (boss.hp / boss.maxHp) * gaugeW;
        ctx.fillStyle = "#ff00ff"; 
        ctx.fillRect(gx, gy, currentW, gaugeH);
        
        ctx.strokeStyle = "#fff"; 
        ctx.lineWidth = 1; 
        ctx.strokeRect(gx, gy, gaugeW, gaugeH);
      } 
      else {
        invaders.forEach(inv => {
          if (inv.alive) {
            if (inv.hitFlash > 0 && Math.floor(inv.hitFlash / 2) % 2 === 0) return;

            ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
            
            if (inv.type === "tako") ctx.fillText("🐙", inv.x + inv.width / 2, inv.y);
            else if (inv.type === "ika") ctx.fillText("🦑", inv.x + inv.width / 2, inv.y); 
            else if (inv.type === "monster") ctx.fillText("👾", inv.x + inv.width / 2, inv.y); 
            else if (inv.type === "phone") ctx.fillText("📱", inv.x + inv.width / 2, inv.y);   
            else if (inv.type === "ari") ctx.fillText("🐜", inv.x + inv.width / 2, inv.y);
            else ctx.fillText("🏍️", inv.x + inv.width / 2, inv.y);
          }
        });
      }
    }

    window.addEventListener("resize", syncLayout);
    
    // 🛠️ 【二重起動を完全に遮断】
    // スクリプト読み込み時の直叩きgameLoop()を完全に排除し、window.onloadでのみ1回起動するように一本化
    window.onload = function() {
      syncLayout();
      initLevel();
      gameLoop(); 
    };
  </script>
</body>
</html>
