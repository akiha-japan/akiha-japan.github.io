<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚀 SPACE HONGDARS Version 2.1 🏍️</title>
  <style>
    /* 画面のスクロールや引っ張りを完全に防止 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ゲームのコンテナ：PCでは480px、スマホでは画面いっぱいに */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px; /* 縦が長すぎる液晶用のストッパー */
      background: #000;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    }
    @media (max-height: 800px) {
      .game-container {
        height: 100vh;
      }
    }

    /* ゲームキャンバス */
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* スコアなどのUIを画面上部に配置 */
    .hud {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 1rem;
      font-weight: bold;
      pointer-events: none; /* タッチをスルーさせる */
      text-shadow: 2px 2px 4px #000, -2px -2px 4px #000;
      z-index: 10;
    }
    #stage-board { color: #00ffff; }
    #score-board { color: #ffffff; }
    #life-board { color: #ff3366; }

    /* 説明・案内用のオーバーレイ幕 */
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 85%;
      background: rgba(17, 17, 17, 0.9);
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #444;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
      z-index: 20;
      box-sizing: border-box;
    }
    .overlay h2 { margin-top: 0; color: #00ff00; font-size: 1.5rem; letter-spacing: 1px; }
    
    .instruction-box {
      text-align: left;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #ccc;
      margin: 15px 0;
      background: #222;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .instruction-box p { margin: 4px 0; }
    .strategy-title {
      color: #ff9900;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      border-bottom: 1px dashed #555;
      padding-bottom: 3px;
    }
    
    .btn-start {
      background: #00cc00;
      border: none;
      color: white;
      padding: 12px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 0 #00aa00;
    }
    .btn-start:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #00aa00;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <div id="stage-board">STAGE: <span id="stage">1</span></div>
      <div id="score-board">SCORE: <span id="score">0</span></div>
      <div id="life-board">LIFE: <span id="life">❤️❤️❤️</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-overlay" class="overlay">
      <h2 id="overlay-title">SPACE HONGDARS v2.1</h2>
      
      <div id="overlay-body">
        <div class="instruction-box">
          <p><span style="color:#00ff00; font-weight:bold;">【操作】</span> 画面をドラッグ（PCは左右矢印キー）で移動。触っている間は<span style="color:#ffff00; font-weight:bold;">自動連射</span>！</p>
          <p><span style="color:#ff3333; font-weight:bold;">【規則】</span> 画面下の赤い防衛線を越えられたら敗北！</p>
        </div>
        
        <div class="instruction-box">
          <span class="strategy-title">💡 攻略ポイント</span>
          <p>① 敵を撃破すると、稀に豪華な <span style="font-size:1.1rem;">👑</span> が落下してくるぞ！</p>
          <p>② <span style="color:#ffff00; font-weight:bold;">👑（王冠）を獲得すると、攻撃が超強力な「3連ワイドショット」に変貌！</span></p>
          <p>③ ステージが進むほど敵の猛攻が増す。最優先で 👑 を狙い、火力を最大に維持せよ！</p>
        </div>
      </div>
      
      <button class="btn-start" id="btn-action">START</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const stageEl = document.getElementById("stage");
    const lifeEl = document.getElementById("life");
    const stageBoardEl = document.getElementById("stage-board");
    
    const overlay = document.getElementById("game-overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayBody = document.getElementById("overlay-body");
    const btnAction = document.getElementById("btn-action");

    let audioCtx = null;

    let isStarted = false;
    let score = 0;
    let stage = 1;
    let lives = 3; 
    let gameOver = false;
    let gameClear = false;
    let invulnerableTimer = 0; 
    let autoFireTimer = 0; 

    const player = { x: 0, y: 0, width: 35, height: 22, speed: 6, mode: 'single' };
    let deadLineY = 0; 

    let bullets = [];
    let invaders = [];
    let particles = [];
    let stars = [];
    let enemyBullets = [];
    let ufo = null;
    let powerup = null;

    let invaderDirection = 1;
    let baseSpeed = 0.6;

    let isPointerDown = false;

    // レスポンシブ＆480px制限対応
    function resizeCanvas() {
      const container = document.querySelector('.game-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;

      player.y = canvas.height - 80;
      deadLineY = canvas.height - 100;

      if (!isStarted && player.x === 0) {
        player.x = canvas.width / 2 - player.width / 2;
      }
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(freq, type, dur) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function updateStageDisplay() {
      if (stage === 3) {
        stageBoardEl.innerHTML = "<span style='color:#ff3333;'>LAST STAGE</span>";
      } else {
        stageBoardEl.innerHTML = "STAGE: <span>" + stage + "</span>";
      }
    }

    function initLevel() {
      invaders = [];
      bullets = [];
      enemyBullets = [];
      ufo = null;
      powerup = null;
      invaderDirection = 1;
      player.mode = 'single'; 

      updateStageDisplay();

      let cols = Math.floor(canvas.width / 60);
      if (cols < 4) cols = 4;
      if (cols > 7) cols = 7; // 480px枠に合わせて最大列数を微調整
      
      let spacing = 52;
      let startX = (canvas.width - ((cols - 1) * spacing + 30)) / 2;

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < cols; c++) {
          let type = "bike";
          if (r === 0) type = "tako";
          if (r === 1) type = "ari";

          invaders.push({
            x: startX + c * spacing,
            y: 70 + r * 40,
            width: 30,
            height: 25,
            type: type,
            alive: true
          });
        }
      }
    }

    // 星の初期化
    stars = [];
    for(let i=0; i<45; i++) {
      stars.push({ x: Math.random() * 480, y: Math.random() * 800, speed: Math.random() * 1.5 + 0.5 });
    }

    // タッチ・マウス操作
    window.addEventListener("pointerdown", (e) => {
      initAudio();
      if (!isStarted) return;
      // ゲームエリア内を触っている時だけ自機を動かす
      const rect = canvas.getBoundingClientRect();
      if (e.clientX >= rect.left && e.clientX <= rect.right) {
        isPointerDown = true;
        updatePlayerPosition(e);
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (!isStarted || gameOver || gameClear) return;
      if (isPointerDown) {
        updatePlayerPosition(e);
      }
    });

    window.addEventListener("pointerup", () => isPointerDown = false);
    window.addEventListener("pointercancel", () => isPointerDown = false);

    function updatePlayerPosition(e) {
      const rect = canvas.getBoundingClientRect();
      const touchX = e.clientX - rect.left;
      player.x = touchX - player.width / 2;
      
      if (player.x < 0) player.x = 0;
      if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
    }

    // PCキーボード操作
    let rightPressed = false;
    let leftPressed = false;
    document.addEventListener("keydown", (e) => {
      initAudio();
      if (e.key === "ArrowRight") { rightPressed = true; isPointerDown = true; }
      if (e.key === "ArrowLeft") { leftPressed = true; isPointerDown = true; }
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight") { rightPressed = false; if(!leftPressed) isPointerDown = false; }
      if (e.key === "ArrowLeft") { leftPressed = false; if(!rightPressed) isPointerDown = false; }
    });

    function checkAutoFire() {
      if (!isPointerDown || gameOver || gameClear) return;

      autoFireTimer++;
      if (autoFireTimer >= 9) { // 連射速度をほんのりアップ（9フレームに1回）
        autoFireTimer = 0;
        fireBullet();
      }
    }

    function fireBullet() {
      if (player.mode === 'wide') {
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 8, vx: -1.5 });
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 8, vx: 0 });
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 8, vx: 1.5 });
      } else {
        bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 8, vx: 0 });
      }
      playSound(340, 'square', 0.05);
    }

    function playerHit() {
      if (invulnerableTimer > 0) return; 

      lives--;
      lifeEl.textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);

      if (lives <= 0) {
        triggerGameOver();
      } else {
        invulnerableTimer = 60; 
        playSound(150, 'sine', 0.3);
        for(let k=0; k<15; k++) {
          particles.push({ x: player.x + 15, y: player.y + 10, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 25, color: "#00ffff" });
        }
      }
    }

    function triggerGameOver() {
      gameOver = true;
      playSound(100, 'sawtooth', 0.6);
      overlayTitle.textContent = "GAME OVER";
      overlayTitle.style.color = "red";
      overlayBody.innerHTML = "<div class='instruction-box'><p>防衛ラインが突破されたか、大破しました。</p></div><p style='font-size:1.4rem;color:#fff;font-weight:bold;margin:10px 0;'>SCORE: " + score + "</p>";
      btnAction.textContent = "RETRY";
      overlay.classList.remove("hidden");
    }

    function triggerGameClear() {
      gameClear = true;
      overlayTitle.textContent = "ALL CLEAR! 🚀";
      overlayTitle.style.color = "#00ff00";
      overlayBody.innerHTML = "<div class='instruction-box'><p>ホングダーから地球の平和は守られた！君こそ真の英雄だ！</p></div><p style='font-size:1.4rem;color:#fff;font-weight:bold;margin:10px 0;'>FINAL SCORE: " + score + "</p>";
      btnAction.textContent = "PLAY AGAIN";
      overlay.classList.remove("hidden");
    }

    btnAction.addEventListener("click", () => {
      initAudio();
      overlay.classList.add("hidden");
      
      score = 0;
      stage = 1;
      lives = 3;
      gameOver = false;
      gameClear = false;
      bullets = [];
      enemyBullets = [];
      particles = [];
      scoreEl.textContent = score;
      lifeEl.textContent = "❤️❤️❤️";
      
      isStarted = true;
      initLevel();
    });

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (isStarted) {
        update();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      if (gameOver || gameClear) return;

      if (invulnerableTimer > 0) invulnerableTimer--;

      stars.forEach(st => {
        st.y += st.speed;
        if(st.y > canvas.height) {
          st.y = 0;
          st.x = Math.random() * canvas.width;
        }
      });

      if(!ufo && Math.random() < 0.003) {
        ufo = { x: -30, y: 40, width: 30, height: 20, speed: canvas.width * 0.005 };
      }
      if(ufo) {
        ufo.x += ufo.speed;
        if(ufo.x > canvas.width) ufo = null;
      }

      if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
      if (leftPressed && player.x > 0) player.x -= player.speed;

      checkAutoFire();

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        b.x += b.vx;
        if (b.y < 0 || b.x < 0 || b.x > canvas.width) {
          bullets.splice(i, 1);
        }
      }

      let shiftDown = false;
      let currentSpeed = (baseSpeed + (stage - 1) * 0.15) * invaderDirection;

      invaders.forEach(inv => {
        if (!inv.alive) return;
        inv.x += currentSpeed;
        
        if (inv.x > canvas.width - inv.width || inv.x < 0) {
          shiftDown = true;
        }
        if (inv.y + inv.height >= deadLineY) {
          triggerGameOver();
        }
      });

      if (shiftDown) {
        invaderDirection *= -1;
        invaders.forEach(inv => {
          if (inv.alive) inv.y += 12; 
        });
      }

      invaders.forEach(inv => {
        if (inv.alive && Math.random() < 0.0004 * stage) {
          enemyBullets.push({ x: inv.x + inv.width/2, y: inv.y + inv.height, speed: 2.5 + stage*0.2, r: 5 });
        }
      });
      if (ufo && Math.random() < 0.01) {
        enemyBullets.push({ x: ufo.x + ufo.width/2, y: ufo.y + ufo.height, speed: 3.5, r: 5 });
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.y += eb.speed;
        if (eb.y > canvas.height) {
          enemyBullets.splice(i, 1);
          continue;
        }

        if (eb.x + eb.r > player.x && eb.x - eb.r < player.x + player.width && 
            eb.y + eb.r > player.y && eb.y - eb.r < player.y + player.height) {
          enemyBullets.splice(i, 1);
          playerHit();
        }
      }

      // 👑 アイテムの更新
      if(powerup) {
        powerup.y += 1.8;
        if(powerup.y > canvas.height) powerup = null;
        else if(powerup.x > player.x && powerup.x < player.x + player.width && powerup.y > player.y && powerup.y < player.y + player.height) {
          player.mode = 'wide'; 
          powerup = null;
          playSound(700, 'sine', 0.2); // アイテム獲得音を少し高く華やかに
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if(p.life <= 0) particles.splice(i, 1);
      }

      // 当たり判定
      for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
        let b = bullets[bIdx];
        let bulletRemoved = false;

        for (let i = 0; i < invaders.length; i++) {
          let inv = invaders[i];
          if (inv.alive && b.x > inv.x && b.x < inv.x + inv.width && b.y > inv.y && b.y < inv.y + inv.height) {
            inv.alive = false;
            bullets.splice(bIdx, 1);
            bulletRemoved = true;
            
            if (inv.type === "tako") score += 30;
            else if (inv.type === "ari") score += 20;
            else score += 10;
            
            scoreEl.textContent = score;
            playSound(150, 'sawtooth', 0.05);

            for(let k=0; k<6; k++) {
              particles.push({
                x: inv.x + inv.width/2,
                y: inv.y + inv.height/2,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 15,
                color: "#ff9900"
              });
            }

            // 👑 の出現判定
            if(Math.random() < 0.15 && !powerup) {
              powerup = { x: inv.x + inv.width/2, y: inv.y };
            }
            
            if (invaders.every(i => !i.alive)) {
              if(stage === 3) { 
                triggerGameClear();
              } else {
                stage++;
                initLevel();
              }
            }
            break;
          }
        }

        if (bulletRemoved) continue;

        if (ufo && b.x > ufo.x && b.x < ufo.x + ufo.width && b.y > ufo.y && b.y < ufo.y + ufo.height) {
          ufo = null;
          bullets.splice(bIdx, 1);
          score += 100;
          scoreEl.textContent = score;
          playSound(500, 'sine', 0.2);
          for(let k=0; k<10; k++) {
            particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 20, color: "#ff9900" });
