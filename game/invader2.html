<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚀 SPACE HONGDARS V2 🏍️</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: none; /* スマホのブラウザスクロールを完全禁止 */
      -webkit-user-select: none;
      user-select: none;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-bottom: 30px;
    }

    .game-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 15px 0 10px 0;
      text-align: center;
      letter-spacing: 1px;
      background: linear-gradient(to right, #00ff00, #ffff00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(0,255,0,0.2);
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 65vh;
      min-height: 440px;
      max-height: 600px;
      background: #000;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.9);
      border: 1px solid #333;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 0.95rem;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 2px 2px 3px #000;
      z-index: 10;
    }
    #stage-board { color: #00ffff; }
    #score-board { color: #ffffff; }
    #life-board { color: #ff3366; }

    .state-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 85%;
      background: rgba(0, 0, 0, 0.95);
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #555;
      z-index: 20;
      box-sizing: border-box;
    }
    .state-overlay h2 { margin: 0 0 10px 0; font-size: 1.5rem; line-height: 1.4; }
    .state-overlay p { margin: 5px 0 15px 0; font-size: 0.95rem; color: #ffcc00; line-height: 1.5; }
    .btn-retry {
      background: #00cc00;
      border: none;
      color: white;
      padding: 10px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 5px;
    }

    .info-area {
      width: 90%;
      max-width: 460px;
      margin-top: 15px;
      box-sizing: border-box;
    }
    .instruction-box {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #ccc;
      background: #222;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      margin-bottom: 10px;
    }
    .strategy-title {
      color: #ff9900;
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
      border-bottom: 1px dashed #444;
      padding-bottom: 2px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="page-wrapper">
    
    <div class="game-title">🚀 SPACE HONGDARS V2 🏍️</div>
    
    <div class="game-container">
      <div class="hud">
        <div id="stage-board">STAGE: <span id="stage">1</span></div>
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <div id="life-board">LIFE: <span id="life">❤️❤️❤️</span></div>
      </div>

      <canvas id="gameCanvas"></canvas>

      <div id="status-panel" class="state-overlay hidden">
        <h2 id="status-title">GAME OVER</h2>
        <p id="status-msg"></p>
        <div id="status-score" style="margin: 10px 0; font-size: 1.2rem; font-weight: bold;"></div>
        <button class="btn-retry" id="btn-retry">RETRY</button>
      </div>
    </div>

    <div class="info-area">
      <div class="instruction-box">
        <span style="color:#00ff00; font-weight:bold;">【操作方法】</span><br>
        画面を左右にドラッグ（PCは左右矢印キー）で自機移動。触っている間は<span style="color:#ffff00; font-weight:bold;">弾がオート連射</span>されます！
      </div>
      
      <div class="instruction-box">
        <span class="strategy-title">💡 攻略ポイント</span>
        ① 敵を撃破すると、まれに豪華な <span style="font-size:1.1rem;">👑</span> が落下してきます。<br>
        ② <span style="color:#ffff00; font-weight:bold;">👑（王冠）を拾うと、攻撃が超強力な「3連ワイドショット」にパワーアップ！</span><br>
        ③ 被弾するか、**ステージをクリアすると通常ショット（1段）に戻る**ため、各面の開幕は慎重に立ち回りましょう。
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const stageEl = document.getElementById("stage");
    const lifeEl = document.getElementById("life");
    const stageBoardEl = document.getElementById("stage-board");
    
    const statusPanel = document.getElementById("status-panel");
    const statusTitle = document.getElementById("status-title");
    const statusMsg = document.getElementById("status-msg");
    const statusScore = document.getElementById("status-score");
    const btnRetry = document.getElementById("btn-retry");

    let audioCtx = null;

    let score = 0;
    let stage = 1;
    let lives = 3; 
    let gameOver = false;
    let gameClear = false;
    let invulnerableTimer = 0; 
    let autoFireTimer = 0; 

    const player = { x: 220, y: 500, width: 35, height: 22, speed: 6, mode: 'single' };
    let deadLineY = 450; 

    let bullets = [];
    let invaders = [];
    let particles = [];
    let stars = [];
    let enemyBullets = [];
    let ufo = null;
    let powerup = null;

    let invaderDirection = 1;
    let baseSpeed = 0.5; // 5段になったため初期の横移動速度をわずかに調整
    let isPointerDown = false;

    function syncLayout() {
      const container = document.querySelector('.game-container');
      const w = container.clientWidth || 480;
      const h = container.clientHeight || 500;
      
      canvas.width = w;
      canvas.height = h;

      player.y = h - 50;
      deadLineY = h - 70;

      if (player.x > w - player.width || player.x === 220) {
        player.x = w / 2 - player.width / 2;
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(freq, type, dur) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function updateStageDisplay() {
      if (stage === 3) {
        stageBoardEl.innerHTML = "<span style='color:#ff3333;'>LAST STAGE</span>";
      } else {
        stageBoardEl.innerHTML = "STAGE: <span>" + stage + "</span>";
      }
    }

    function initLevel() {
      invaders = [];
      bullets = [];
      enemyBullets = [];
      ufo = null;
      powerup = null;
      invaderDirection = 1;

      updateStageDisplay();

      let cols = Math.floor(canvas.width / 60);
      if (cols < 4) cols = 4;
      if (cols > 7) cols = 7;
      
      let spacing = 52;
      let startX = (canvas.width - ((cols - 1) * spacing + 30)) / 2;

      // 5段編成（上から順にキャラをバラエティ豊かに配置）
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < cols; c++) {
          let type = "bike";
          if (r === 0) type = "tako"; // 🐙
          if (r === 1) type = "monster"; // 👾 (新)
          if (r === 2) type = "phone"; // 📱 (新)
          if (r === 3) type = "ari"; // 🐜

          invaders.push({
            x: startX + c * spacing,
            y: 45 + r * 34, // 縦の間隔を少し詰めて画面内に収めています
            width: 30,
            height: 25,
            type: type,
            alive: true
          });
        }
      }
    }

    stars = [];
    for(let i=0; i<40; i++) {
      stars.push({ x: Math.random() * 48
