<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>akiha</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background: radial-gradient(circle at top, #1e3a8a, #0b1220);
  color:#fff;
}

/* ヘッダー */
header{
  text-align:center;
  padding:40px 20px 20px;
}

.logo{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:20px;
  border:2px solid #38bdf8;
  margin-bottom:15px;
}

h1{
  font-size:52px;
  margin:0;
  color:#38bdf8;
}

p{
  color:#cbd5e1;
}

/* SNS */
.sns{
  text-align:center;
  margin-top:15px;
}

.sns a{
  display:inline-block;
  margin:5px 8px;
  padding:8px 14px;
  background:#111827;
  border:1px solid #334155;
  border-radius:20px;
  color:white;
  text-decoration:none;
  font-size:13px;
}

/* コンテナ */
.container{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

/* カード */
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:20px;
  margin:15px 0;
  border-radius:16px;
  text-decoration:none;
  color:white;
  display:block;
  transition:0.2s;
}

.card:hover{
  border-color:#38bdf8;
  transform:scale(1.02);
}

.title{
  font-size:20px;
  margin-bottom:6px;
}

.desc{
  font-size:13px;
  color:#cbd5e1;
}

/* YouTube */
.youtube{
  margin-top:40px;
  background:#111827;
  border:1px solid #1f2937;
  padding:15px;
  border-radius:12px;
}

.youtube h2{
  font-size:16px;
  color:#38bdf8;
  margin-bottom:10px;
}

iframe{
  width:100%;
  height:400px;
  border:none;
  border-radius:10px;
}

/* フッター */
footer{
  text-align:center;
  padding:40px 10px;
  color:#64748b;
  font-size:12px;
}
</style>

</head>

<body>

<header>

  <img src="logo.png" class="logo" alt="logo">

  <h1>akiha</h1>
  <p>Tools / Games / Projects</p>

  <div class="sns">
    <a href="https://x.com/aki20240628" target="_blank">X</a>
    <a href="https://www.youtube.com/@akiha2026" target="_blank">YouTube</a>
    <a href="https://note.com/aki20240628" target="_blank">note</a>
  </div>

</header>

<div class="container">

  <!-- ツール -->
  <a class="card" href="/tool/simulator.html">
    <div class="title">YouTube収益シミュレーター</div>
    <div class="desc">再生回数・単価で収益計算</div>
  </a>

  <!-- ゲーム -->
  <a class="card" href="/game/invader.html">
    <div class="title">🚀 SPACE HONGDARS 🛵</div>
    <div class="desc">シューティングゲーム</div>
  </a>

  <!-- YouTube埋め込み（安定版） -->
  <div class="youtube">
    <h2>📺 最新動画</h2>

    <iframe
      src="https://www.youtube.com/embed/videoseries?list=UUAfH0IV-iZvIbgNrq5EI13Q"
      allowfullscreen>
    </iframe>

  </div>

</div>

<footer>
  © akiha
</footer>

</body>
</html>
