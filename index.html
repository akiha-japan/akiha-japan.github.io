<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>akiha</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background: radial-gradient(circle at top, #1e3a8a, #0b1220);
  color:#fff;
}

/* ヘッダー */
header{
  text-align:center;
  padding:40px 20px 20px;
}

.logo{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:20px;
  border:2px solid #38bdf8;
  margin-bottom:15px;
}

h1{
  font-size:52px;
  margin:0;
  color:#38bdf8;
}

p{
  color:#cbd5e1;
}

/* SNS */
.sns{
  text-align:center;
  margin-top:15px;
}

.sns a{
  display:inline-block;
  margin:5px 8px;
  padding:8px 14px;
  background:#111827;
  border:1px solid #334155;
  border-radius:20px;
  color:white;
  text-decoration:none;
  font-size:13px;
}

/* コンテンツ */
.container{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

/* カード */
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:20px;
  margin:15px 0;
  border-radius:16px;
  text-decoration:none;
  color:white;
  display:block;
}

/* YouTube */
.youtube{
  margin-top:40px;
  background:#111827;
  border:1px solid #1f2937;
  padding:15px;
  border-radius:12px;
}

.youtube h2{
  font-size:16px;
  color:#38bdf8;
  margin-bottom:10px;
}

/* ★16:9固定 */
.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
}

iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:0;
}

/* フッター */
footer{
  text-align:center;
  padding:40px 10px;
  color:#64748b;
  font-size:12px;
}
</style>

</head>

<body>

<header>

  <img src="logo.png" class="logo" alt="logo">

  <h1>akiha</h1>
  <p>Tools / Games / Projects</p>

  <div class="sns">
    <a href="https://x.com/aki20240628" target="_blank">X</a>
    <a href="https://www.youtube.com/@akiha2026" target="_blank">YouTube</a>
    <a href="https://note.com/aki20240628" target="_blank">note</a>
  </div>

</header>

<div class="container">

  <a class="card" href="/tool/simulator.html">
    <div class="title">YouTube収益シミュレーター</div>
    <div class="desc">再生回数・単価で収益計算</div>
  </a>

  <a class="card" href="/game/invader.html">
    <div class="title">🚀 SPACE HONGDARS 🛵</div>
    <div class="desc">シューティングゲーム</div>
  </a>

  <!-- YouTubeランダム表示 -->
  <div class="youtube">
    <h2>📺 ランダム動画</h2>

    <div class="video-wrap">
      <iframe id="yt"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</div>

<footer>
  © akiha
</footer>

<script>
// あなたの再生リストID
const playlistId = "PLr0D8f47L11xSGgpHFfwN7voqJcXr_3DN";

// 【対策】YouTubeの制限を回避するため、再生リストのデータを直接取得してシャッフルする
fetch(`https://exportdownload.com/api/youtube/playlist?id=${playlistId}`)
  .then(res => res.json())
  .then(data => {
    // 再生リスト内の全動画IDを配列にする
    const videos = data.map(item => item.id);
    
    if (videos.length > 0) {
      // 340本以上ある全動画の中から、完全にランダムで1本選ぶ
      const pick = videos[Math.floor(Math.random() * videos.length)];
      
      // 埋め込みプレイヤーにセット（これなら絶対に偏りません！）
      document.getElementById("yt").src = "https://www.youtube.com/embed/" + pick;
    }
  })
  .catch(err => {
    // 万が一上の自動取得がエラーになった場合のセーフティ（元々入っていた動画を流す）
    document.getElementById("yt").src = "https://www.youtube.com/embed/VR0lZ93dzaI";
  });
</script>

</body>
</html>
