<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKIHA JAPAN</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0b1220;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 50px 20px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 2px;
    }

    header p {
      color: #94a3b8;
      margin-top: 10px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .section {
      margin-top: 30px;
    }

    .section-title {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 10px;
      border-left: 3px solid #38bdf8;
      padding-left: 10px;
    }

    .card {
      background: #111827;
      padding: 18px;
      margin: 12px 0;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      display: block;
      transition: 0.2s;
      border: 1px solid #1f2937;
    }

    .card:hover {
      background: #1f2937;
      transform: translateY(-2px);
    }

    .title {
      font-size: 17px;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 13px;
      color: #94a3b8;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 40px 10px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }
      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>AKIHA JAPAN</h1>
  <p>Tools / Games / Projects</p>
</header>

<div class="container">

  <div class="section">
    <div class="section-title">📊 Tools</div>

    <a class="card" href="/tool/simulator.html">
      <div class="title">YouTube収益シミュレーター</div>
      <div class="desc">再生回数・単価・スパチャで収益計算</div>
    </a>
  </div>

  <div class="section">
    <div class="section-title">🎮 Games</div>

    <a class="card" href="/game/invader.html">
      <div class="title">SPACE INVADERS</div>
      <div class="desc">シンプルシューティングゲーム</div>
    </a>
  </div>

</div>

<footer>
  © AKIHA JAPAN
</footer>

</body>
</html>
