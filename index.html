<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKIHA JAPAN</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background: radial-gradient(circle at top, #1e3a8a, #0b1220);
  color:#fff;
}

header{
  text-align:center;
  padding:60px 20px 30px;
}

header h1{
  font-size:52px;
  margin:0;
  color:#38bdf8;
  letter-spacing:3px;
}

header p{
  color:#cbd5e1;
  margin-top:10px;
}

.container{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:20px;
  margin:15px 0;
  border-radius:16px;
  text-decoration:none;
  color:white;
  display:block;
  transition:0.2s;
  backdrop-filter: blur(6px);
}

.card:hover{
  transform:scale(1.03);
  border-color:#38bdf8;
}

.title{
  font-size:20px;
  margin-bottom:6px;
}

.desc{
  font-size:13px;
  color:#cbd5e1;
}

.badge{
  display:inline-block;
  font-size:11px;
  padding:3px 8px;
  background:#38bdf8;
  color:#0b1220;
  border-radius:20px;
  margin-bottom:8px;
}

footer{
  text-align:center;
  padding:40px 10px;
  color:#64748b;
  font-size:12px;
}
</style>

</head>

<body>

<header>
  <h1>AKIHA JAPAN</h1>
  <p>Tools / Games / Projects</p>
</header>

<div class="container">

  <a class="card" href="/tool/simulator.html">
    <div class="badge">TOOL</div>
    <div class="title">YouTube収益シミュレーター</div>
    <div class="desc">再生回数・単価・スパチャで収益計算</div>
  </a>

  <a class="card" href="/game/invader.html">
    <div class="badge">GAME</div>
    <div class="title">SPACE INVADERS</div>
    <div class="desc">シューティングゲーム</div>
  </a>

</div>

<footer>
  © AKIHA JAPAN
</footer>

</body>
</html>
