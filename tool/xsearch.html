<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>X検索ジェネレーター</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f7f9;
  margin: 0;
  padding: 12px;
}

.container {
  max-width: 720px;
  margin: auto;
}

/* ヘッダー */
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header {
  font-size: 18px;
  font-weight: bold;
}

.icon-link {
  font-size: 18px;
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #ddd;
  background: #fff;
}

.sub {
  font-size: 12px;
  color: #666;
  margin-bottom: 10px;
}

/* カード */
.box {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 10px;
}

.section-title {
  font-size: 12px;
  font-weight: bold;
  margin-top: 8px;
  margin-bottom: 4px;
}

input, select {
  width: 100%;
  padding: 8px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

/* ボタン */
button {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border: none;
  border-radius: 6px;
  margin-top: 6px;
  cursor: pointer;
}

.btn1 {
  background: #1d9bf0;
  color: white;
}

.btn2 {
  background: #111;
  color: white;
}

/* 出力 */
pre {
  background: #111;
  color: #0f0;
  padding: 10px;
  border-radius: 6px;
  overflow-x: auto;
}

/* スマホ */
@media (max-width: 600px) {
  .header { font-size: 16px; }
  button { font-size: 14px; }
}
</style>
</head>

<body>

<div class="container">

<!-- ヘッダー -->
<div class="header-row">
  <div class="header">X検索ジェネレーター</div>

  <a class="icon-link"
     href="https://hoshuto-app.vercel.app/x-search"
     target="_blank"
     title="元ページ">
    🔗
  </a>
</div>

<div class="sub">高度な検索もどき</div>

<!-- キーワード -->
<div class="box">
  <div class="section-title">キーワード</div>
  <input id="keyword" placeholder="例: what's happening" />

  <div class="section-title">完全一致</div>
  <input id="exact" placeholder="例: happy hour" />

  <div class="section-title">いずれか含む</div>
  <input id="any" placeholder="例: cats dogs" />

  <div class="section-title">含まない</div>
  <input id="none" placeholder="例: spam ads" />

  <div class="section-title">ハッシュタグ</div>
  <input id="tag" placeholder="例: ThrowbackThursday" />
</div>

<!-- アカウント -->
<div class="box">
  <div class="section-title">アカウント</div>
  <input id="from" placeholder="from:" />
  <input id="to" placeholder="to:" />
  <input id="mention" placeholder="@mention" />
</div>

<!-- フィルタ -->
<div class="box">
  <div class="section-title">フィルター</div>

  <select id="replies">
    <option value="">返信フィルタなし</option>
    <option value="no">返信を除外</option>
  </select>

  <select id="links">
    <option value="">リンクフィルタなし</option>
    <option value="yes">リンクを含む</option>
    <option value="only">リンクのみ</option>
  </select>
</div>

<!-- エンゲージメント -->
<div class="box">
  <div class="section-title">エンゲージメント</div>
  <input id="repliesMin" type="number" placeholder="最小返信数" />
  <input id="likesMin" type="number" placeholder="最小いいね数" />
  <input id="repostMin" type="number" placeholder="最小リポスト数" />
</div>

<!-- 日付（2010〜2035・デフォ2026） -->
<div class="box">
  <div class="section-title">日付（以降）</div>
  <div style="display:flex; gap:5px;">
    <select id="sy"></select>
    <select id="sm"></select>
    <select id="sd"></select>
  </div>

  <div class="section-title">日付（以前）</div>
  <div style="display:flex; gap:5px;">
    <select id="ey"></select>
    <select id="em"></select>
    <select id="ed"></select>
  </div>
</div>

<!-- 順番 -->
<button class="btn1" onclick="makeQuery()">検索コマンド生成</button>

<h3>生成結果</h3>
<pre id="out"></pre>

<button class="btn2" onclick="searchX()">Xで検索</button>

</div>

<script>

// 年月日セレクト生成
function fillSelect(id, start, end, def) {
  const el = document.getElementById(id);
  for (let i = start; i <= end; i++) {
    const opt = document.createElement("option");
    opt.value = i < 10 ? "0"+i : ""+i;
    opt.textContent = i;
    if (i === def) opt.selected = true;
    el.appendChild(opt);
  }
}

// 2010〜2035、デフォ2026
fillSelect("sy", 2010, 2035, 2026);
fillSelect("ey", 2010, 2035, 2026);

fillSelect("sm", 1, 12, 1);
fillSelect("em", 1, 12, 12);

fillSelect("sd", 1, 31, 1);
fillSelect("ed", 1, 31, 31);

function buildQuery() {
  let q = "";

  const keyword = keyword.value;
  const exact = exact.value;
  const any = any.value;
  const none = none.value;
  const tag = tag.value;

  const from = from.value;
  const to = to.value;
  const mention = mention.value;

  const replies = replies.value;
  const links = links.value;

  const repliesMin = repliesMin.value;
  const likesMin = likesMin.value;
  const repostMin = repostMin.value;

  const sy = sy.value, sm = sm.value, sd = sd.value;
  const ey = ey.value, em = em.value, ed = ed.value;

  if (keyword) q += keyword + " ";
  if (exact) q += `"${exact}" `;
  if (any) q += any.split(" ").join(" OR ") + " ";
  if (none) q += none.split(" ").map(w => "-" + w).join(" ") + " ";
  if (tag) q += "#" + tag + " ";

  if (from) q += `from:${from} `;
  if (to) q += `to:${to} `;
  if (mention) q += `@${mention} `;

  if (replies === "no") q += "-filter:replies ";
  if (links === "yes") q += "filter:links ";
  if (links === "only") q += "filter:links ";

  if (repliesMin) q += `min_replies:${repliesMin} `;
  if (likesMin) q += `min_faves:${likesMin} `;
  if (repostMin) q += `min_retweets:${repostMin} `;

  if (sy && sm && sd) q += `since:${sy}-${sm}-${sd} `;
  if (ey && em && ed) q += `until:${ey}-${em}-${ed} `;

  return q.trim();
}

function makeQuery() {
  document.getElementById("out").textContent = buildQuery();
}

function searchX() {
  const q = buildQuery();
  const url = "https://twitter.com/search?q=" + encodeURIComponent(q);
  window.open(url, "_blank");
}

</script>

</body>
</html>
