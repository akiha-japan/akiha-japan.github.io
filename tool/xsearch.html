<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>X検索ジェネレーター</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f7f9;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
}

/* ヘッダー行（タイトル＋リンクアイコン） */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}

.header {
  font-size: 20px;
  font-weight: bold;
}

.icon-link {
  font-size: 18px;
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 6px;
  background: #fff;
  border: 1px solid #ddd;
}

.icon-link:hover {
  background: #f0f0f0;
}

.sub {
  font-size: 12px;
  color: #666;
  margin-bottom: 15px;
}

/* カード */
.box {
  background: #fff;
  border: 1px solid #ddd;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 6px;
}

.section-title {
  font-size: 13px;
  font-weight: bold;
  margin: 10px 0 5px;
  color: #333;
}

input, select {
  width: 100%;
  padding: 8px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

.row {
  display: flex;
  gap: 10px;
}

.row > div {
  flex: 1;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  font-size: 15px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.btn1 {
  background: #1d9bf0;
  color: #fff;
}

.btn2 {
  background: #222;
  color: #fff;
}

pre {
  background: #111;
  color: #0f0;
  padding: 10px;
  border-radius: 4px;
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="container">

<!-- ヘッダー -->
<div class="header-row">
  <div class="header">X検索ジェネレーター</div>

  <a class="icon-link"
     href="https://hoshuto-app.vercel.app/x-search"
     target="_blank"
     title="高度な検索もどきを開く">
    🔗
  </a>
</div>

<div class="sub">高度な検索もどき</div>

<!-- キーワード -->
<div class="box">
  <div class="section-title">キーワード</div>
  <input id="keyword" placeholder="例: what's happening" />

  <div class="section-title">完全一致</div>
  <input id="exact" placeholder="例: happy hour" />

  <div class="section-title">いずれか含む</div>
  <input id="any" placeholder="例: cats dogs" />

  <div class="section-title">含まない</div>
  <input id="none" placeholder="例: spam ads" />

  <div class="section-title">ハッシュタグ</div>
  <input id="tag" placeholder="例: ThrowbackThursday" />
</div>

<!-- アカウント -->
<div class="box">
  <div class="section-title">アカウント</div>
  <input id="from" placeholder="from: X" />
  <input id="to" placeholder="to: X" />
  <input id="mention" placeholder="@mention" />
</div>

<!-- フィルタ -->
<div class="box">
  <div class="section-title">フィルター</div>

  <select id="replies">
    <option value="">返信フィルタなし</option>
    <option value="no">返信を除外</option>
  </select>

  <br><br>

  <select id="links">
    <option value="">リンクフィルタなし</option>
    <option value="yes">リンクを含む</option>
    <option value="only">リンクのみ</option>
  </select>
</div>

<!-- エンゲージメント -->
<div class="box">
  <div class="section-title">エンゲージメント</div>
  <input id="repliesMin" type="number" placeholder="最小返信数" />
  <input id="likesMin" type="number" placeholder="最小いいね数" />
  <input id="repostMin" type="number" placeholder="最小リポスト数" />
</div>

<!-- 日付 -->
<div class="box">
  <div class="section-title">日付</div>

  <input id="since" placeholder="since: 2026-01-01" />
  <input id="until" placeholder="until: 2026-12-31" />
</div>

<!-- ボタン -->
<button class="btn1" onclick="makeQuery()">検索コマンド生成</button>
<button class="btn2" onclick="searchX()">Xで検索</button>

<h3>生成結果</h3>
<pre id="out"></pre>

</div>

<script>
function buildQuery() {
  let q = "";

  const keyword = document.getElementById("keyword").value;
  const exact = document.getElementById("exact").value;
  const any = document.getElementById("any").value;
  const none = document.getElementById("none").value;
  const tag = document.getElementById("tag").value;

  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const mention = document.getElementById("mention").value;

  const replies = document.getElementById("replies").value;
  const links = document.getElementById("links").value;

  const repliesMin = document.getElementById("repliesMin").value;
  const likesMin = document.getElementById("likesMin").value;
  const repostMin = document.getElementById("repostMin").value;

  const since = document.getElementById("since").value;
  const until = document.getElementById("until").value;

  // キーワード
  if (keyword) q += keyword + " ";
  if (exact) q += `"${exact}" `;
  if (any) q += any.split(" ").join(" OR ") + " ";
  if (none) q += none.split(" ").map(w => "-" + w).join(" ") + " ";
  if (tag) q += "#" + tag + " ";

  // アカウント
  if (from) q += `from:${from} `;
  if (to) q += `to:${to} `;
  if (mention) q += `@${mention} `;

  // フィルタ
  if (replies === "no") q += "-filter:replies ";
  if (links === "yes") q += "filter:links ";
  if (links === "only") q += "filter:links ";

  // エンゲージメント
  if (repliesMin) q += `min_replies:${repliesMin} `;
  if (likesMin) q += `min_faves:${likesMin} `;
  if (repostMin) q += `min_retweets:${repostMin} `;

  // 日付
  if (since) q += `since:${since} `;
  if (until) q += `until:${until} `;

  return q.trim();
}

function makeQuery() {
  document.getElementById("out").textContent = buildQuery();
}

function searchX() {
  const q = buildQuery();
  const url = "https://twitter.com/search?q=" + encodeURIComponent(q);
  window.open(url, "_blank");
}
</script>

</body>
</html>
